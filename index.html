<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Развес массивов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: инженерный лист — слева пульт ввода, справа разрез зала, под ним массив крупно и таблица колонок */
:root {
  --bg: #eceeea;
  --panel: #f7f8f5;
  --ink: #171a18;
  --muted: #5d6560;
  --line: #c9cec8;
  --grid: #dfe3dd;
  --accent: #c8501a;
  --accent-ink: #ffffff;
  --cabinet: #23272a;
  --cabinet-edge: #4a5054;
  --on-cabinet: #eef1ec;
  --audience: #6b4fa8;
  --ray-a: #1f5aa6;
  --ray-b: #d9761c;
  --ok: #2c7a50;
  --warn: #a8700f;
  --bad: #b8362a;
  --f-display: "Fira Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121514; --panel: #1a1e1c; --ink: #e5e9e4; --muted: #949d97; --line: #323935; --grid: #232926;
    --accent: #f07a3c; --accent-ink: #1a1e1c; --cabinet: #0b0d0c; --cabinet-edge: #8b938e; --audience: #a78bfa;
    --ray-a: #5b9be8; --ray-b: #f3a04a; --ok: #4cc38a; --warn: #f0b44c; --bad: #ff6b5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121514; --panel: #1a1e1c; --ink: #e5e9e4; --muted: #949d97; --line: #323935; --grid: #232926;
  --accent: #f07a3c; --accent-ink: #1a1e1c; --cabinet: #0b0d0c; --cabinet-edge: #8b938e; --audience: #a78bfa;
  --ray-a: #5b9be8; --ray-b: #f3a04a; --ok: #4cc38a; --warn: #f0b44c; --bad: #ff6b5e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 16px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
header.top h1 {
  margin: 0; font: 700 26px/1.1 var(--f-display); letter-spacing: .01em; text-wrap: balance;
}
header.top .sub { color: var(--muted); font-size: 13px; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }

/* пульт ввода */
.controls { padding: 14px; display: grid; gap: 18px; }
.group { display: grid; gap: 10px; }
.group h2, .card h2 {
  margin: 0; font: 600 12px/1 var(--f-display); text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
}
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; }
.field label { font-size: 13px; }
.field .hint { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.field input[type="number"], .field select {
  width: 104px; font: 500 14px var(--f-data); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; text-align: right;
}
.field select { text-align: left; width: 168px; font-family: var(--f-body); }
.stepper { display: flex; gap: 4px; }
.stepper input { width: 64px !important; text-align: center !important; }
button {
  font: 600 13px var(--f-display); letter-spacing: .03em; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.stepper button { width: 32px; padding: 6px 0; font-family: var(--f-data); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tab.add { color: var(--accent); }
input.text {
  width: 168px; font: 500 14px var(--f-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px;
}
input:disabled, select:disabled, button:disabled { opacity: .55; cursor: not-allowed; }
.mirror-note { font-size: 12px; color: var(--muted); display: grid; gap: 6px; padding: 8px 10px; border-radius: 4px; background: color-mix(in oklab, var(--accent) 8%, transparent); }
.mirror-note button { justify-self: start; }
.zone-card { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.zone-head { display: flex; gap: 6px; }
.zone-head input.text { flex: 1; width: auto; min-width: 0; background: var(--panel); }
.zone-head button { width: 32px; padding: 0; font-size: 16px; }
.zone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.zone-grid label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.zone-grid input {
  width: 100%; font: 500 13px var(--f-data); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; text-align: right;
}
.legend .lg-title { color: var(--ink); font-weight: 500; }
.auto { display: grid; gap: 8px; padding-top: 4px; }
.auto button.primary { padding: 9px 12px; font-size: 14px; }
.auto .hint { color: var(--muted); font-size: 12px; }
.auto-result { display: grid; gap: 6px; font-size: 13px; padding: 8px 10px; border-radius: 4px; background: color-mix(in oklab, var(--ok) 10%, transparent); }
.auto-result button { justify-self: start; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* результаты */
.results { display: grid; gap: 16px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: grid; gap: 2px; padding: 8px 12px; border-radius: var(--r); background: var(--panel);
  border: 1px solid var(--line); border-left-width: 4px; min-width: 128px;
}
.chip .k { font: 600 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.chip .v { font: 500 17px/1.2 var(--f-data); font-variant-numeric: tabular-nums; }
.chip.ok { border-left-color: var(--ok); }
.chip.warn { border-left-color: var(--warn); }
.chip.bad { border-left-color: var(--bad); }

.card { padding: 12px 14px 14px; display: grid; gap: 10px; min-width: 0; }
.card .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.card .note { color: var(--muted); font-size: 12px; }
.view { width: 100%; overflow-x: auto; }
.view svg { display: block; width: 100%; height: auto; margin: 0 auto; }

.lower { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .lower { grid-template-columns: minmax(0, 1fr); } }

/* таблица колонок */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 11px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
td { font: 400 13px var(--f-data); }
th:first-child, td:first-child { text-align: left; }
td.where { font-family: var(--f-body); text-align: left; }
td select { font: 500 13px var(--f-data); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 4px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
tr.hl td { background: color-mix(in oklab, var(--accent) 10%, transparent); }
.tag { font: 600 11px var(--f-display); letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; }
.tag.ok { color: var(--ok); background: color-mix(in oklab, var(--ok) 14%, transparent); }
.tag.warn { color: var(--warn); background: color-mix(in oklab, var(--warn) 16%, transparent); }
.tag.bad { color: var(--bad); background: color-mix(in oklab, var(--bad) 14%, transparent); }

/* чертёж */
svg .g { stroke: var(--grid); stroke-width: 1; }
svg .g.gm { stroke: var(--line); }
svg .ax { fill: var(--muted); font: 11px var(--f-data); }
svg .lbl { fill: var(--muted); font: 12px var(--f-body); }
svg .room { fill: none; stroke: var(--ink); stroke-width: 1.5; }
svg .aud { stroke: var(--audience); stroke-width: 4; stroke-linecap: round; }
svg .aud-fill { fill: var(--audience); opacity: .08; }
svg .frame { fill: var(--accent); stroke: var(--accent); stroke-width: 1; }
svg .box { fill: var(--cabinet); stroke: var(--cabinet-edge); stroke-width: .75; }
svg .cone { opacity: .13; }
svg .ray { stroke-width: 1.6; }
svg .hit { stroke: var(--panel); stroke-width: 1.5; }
svg .num { fill: var(--on-cabinet); font: 600 12px var(--f-data); }
svg .ang { fill: var(--ink); font: 500 11px var(--f-data); }
svg .cov0, .legend .cov0 { fill: var(--bad); background: var(--bad); }
svg .cov1, .legend .cov1 { fill: var(--ok); background: var(--ok); opacity: .55; }
svg .cov2, .legend .cov2 { fill: var(--ok); background: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; height: 7px; border-radius: 2px; }
svg .lvl { fill: none; stroke: var(--audience); stroke-width: 2; stroke-linejoin: round; }
svg .lvl-fill { fill: var(--audience); opacity: .1; }
svg .lvl-mean { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
svg .zone { fill: var(--audience); fill-opacity: .08; stroke: var(--audience); stroke-width: 1.5; }
svg .zone.mapped { fill: none; }
svg .zlbl { fill: var(--ink); font: 600 12px var(--f-display); letter-spacing: .03em; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
svg .cut { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 5; }
svg .hang { cursor: grab; touch-action: none; }
svg .hang .foot { fill: var(--cabinet); stroke: var(--cabinet-edge); stroke-width: 1; }
svg .hang .dir { stroke: var(--muted); stroke-width: 2; }
svg .hang .dir-head { fill: var(--muted); }
svg .hang .grab { fill: transparent; }
svg .hang.sel .foot { stroke: var(--accent); stroke-width: 2.5; }
svg .hang.sel .dir { stroke: var(--accent); }
svg .hang.sel .dir-head { fill: var(--accent); }
svg .subg { cursor: grab; touch-action: none; }
svg .subg .foot { fill: var(--cabinet); fill-opacity: .55; stroke: var(--cabinet-edge); stroke-width: 1; stroke-dasharray: 3 2; }
svg .subg .dir { stroke: var(--muted); stroke-width: 1.5; }
svg .subg .dir-head { fill: var(--muted); }
svg .subg .grab { fill: transparent; }
svg .subg.sel .foot { stroke: var(--accent); stroke-width: 2; }
svg .subg.sel .dir { stroke: var(--accent); }
svg .subg.sel .dir-head { fill: var(--accent); }
svg .hlbl { fill: var(--ink); font: 600 12px var(--f-display); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
svg .dim { opacity: .12; }
svg .cone.dim { opacity: .03; }
svg [data-i] { cursor: pointer; transition: opacity .15s; }
tbody tr { cursor: pointer; }

footer.notes { color: var(--muted); font-size: 12px; max-width: 80ch; display: grid; gap: 6px; }
footer.notes p { margin: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
// ---------- библиотека колонок ----------
// Размеры — метры, углы — градусы.
// profile — боковой профиль: [расстояние от фронта назад, полувысота]; шарнир между колонками — передняя кромка.
// arc — раскрытие волнового фронта одной колонки по вертикали (0 — плоский фронт, как DOSC у L-Acoustics).
// maxSpl — пиковый уровень одной колонки на 1 м в свободном поле (без пола), розовый шум. Где производитель
// даёт полупространство (саб на полу), вычтено 6 дБ: отражение от пола калькулятор не считает.
// hPatterns — диаграмма по горизонтали: полуугол −6 дБ влево и вправо (если смотреть со сцены в зал), gain — прибавка уровня.
const MODELS = {
  cad208: {
    brand: 'HK Audio', label: 'HK Audio CAD 208', short: 'CAD 208',
    h: 0.2382,
    profile: [[0, 0.1191], [0.0295, 0.1165], [0.3650, 0.0724], [0.3666, 0.0624]],
    width: 0.581,
    vDisp: 15,
    arc: 15,
    hPatterns: { '100': { label: '100°', left: 50, right: 50, gain: 0 } },
    hDefault: '100',
    band: [100, 18000],
    maxSpl: 125, // 95 дБ 1 Вт/1 м + 1000 Вт пик
    weight: 17.5,
    splays: [0, 1.5, 3, 4.5, 6, 7.5, 9, 10.5, 12, 13.5, 15],
    frameSplays: [0, 1.5, 3, 4.5, 6, 7.5],
    maxBoxes: 24,
    frame: { label: 'CADIS Rigging Frame', weight: 11.5, maxLoad: 400, maxBoxes: 20, len: 0.45, thick: 0.05 },
    source: 'размеры — чертёж HK Audio (DXF), углы и нагрузки — CADIS Manual 1.0',
  },
  kara2: {
    brand: 'L-Acoustics', label: 'L-Acoustics Kara II', short: 'Kara II',
    h: 0.252,
    profile: [[0, 0.126], [0.03, 0.1235], [0.47, 0.085], [0.482, 0.081]],
    width: 0.733,
    vDisp: 10,
    arc: 0,
    hPatterns: {
      '110': { label: 'Panflex 110°', left: 55, right: 55, gain: 0 },
      '70': { label: 'Panflex 70°', left: 35, right: 35, gain: 2 },
      '90L': { label: 'Panflex 90°, шире влево', left: 55, right: 35, gain: 1 },
      '90R': { label: 'Panflex 90°, шире вправо', left: 35, right: 55, gain: 1 },
    },
    hDefault: '110',
    band: [55, 20000],
    maxSpl: 140, // 142 дБ в пресете 70°; Panflex 70° добавляет свои +2 дБ
    weight: 26,
    splays: [0, 1, 2, 3, 4, 5, 7.5, 10],
    frameSplays: [0],
    maxBoxes: 24,
    frame: { label: 'M-BUMP', weight: 24.5, maxLoad: null, maxBoxes: 24, len: 0.75, thick: 0.08 },
    source: 'размеры, вес и углы — спецификация L-Acoustics KARA II SPS EN 1.1; вес M-BUMP (24,5 кг) — по каталогу прокатчика, проверь в Soundvision',
  },
};
// ---------- сабвуферы ----------
// W × H × D — ширина, высота, глубина корпуса, лёжа (как обычно ставят). band — рабочая полоса.
const SUBS = {
  cad115: {
    label: 'HK Audio CAD 115 Sub', short: 'CAD 115', drivers: '1 × 15"',
    W: 0.583, H: 0.573, D: 0.64, weight: 38, band: [45, 150], maxSpl: 129, // расчётный максимум, свободное поле
    source: 'CADIS Manual 1.0',
  },
  sb18: {
    label: 'L-Acoustics SB18', short: 'SB18', drivers: '1 × 18"',
    W: 0.707, H: 0.553, D: 0.75, weight: 52, band: [32, 100], maxSpl: 132, // 138 дБ в полупространстве
    source: 'вес и полоса — L-Acoustics, размеры — спецификация Kara II/SB18 и каталог продавца',
  },
  ks28: {
    label: 'L-Acoustics KS28', short: 'KS28', drivers: '2 × 18"',
    W: 1.34, H: 0.55, D: 0.719, weight: 79, band: [25, 100], maxSpl: 137, // 143 дБ в полупространстве
    source: 'официальная страница L-Acoustics',
  },
  sb28: {
    label: 'L-Acoustics SB28', short: 'SB28', drivers: '2 × 18"',
    W: 1.30, H: 0.55, D: 0.70, weight: 93, band: [25, 100], maxSpl: 136, // 142 дБ, считаем как полупространство
    source: 'спецификация L-Acoustics SB28 (SP JP 6.0), пресет SB28_100',
  },
};

// Зеркальная копия меняет «шире влево» на «шире вправо»
const MIRROR_PATTERN = { '90L': '90R', '90R': '90L' };

<script>
// ---------- общая математика ----------
const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function snap(v, list) {
  return list.reduce((best, x) => Math.abs(x - v) < Math.abs(best - v) ? x : best, list[0]);
}

// ---------- координаты ----------
// Зал: X — в глубину (0 — передняя стена у сцены, L — задняя стена), Y — поперёк
// (плюс — слева, если смотреть со сцены в зал, 0 — середина), Z — высота от пола.
// Подвес стоит в точке (x, y) — передняя верхняя точка первой колонки, z — её высота.
// Плоскость подвеса: x — вперёд по оси подвеса от этой точки, y — высота. Углы наклона: плюс — вниз.

// Массив в своей вертикальной плоскости
function computeArray(h) {
  const m = MODELS[h.model];
  const half = m.profile[0][1];
  const boxes = [];
  let top = { x: 0, y: h.z };
  let phi = h.tilt;
  for (let i = 0; i < h.n; i++) {
    phi += h.angles[i];
    const r = rad(phi);
    const a = { x: Math.cos(r), y: -Math.sin(r) };   // ось колонки
    const u = { x: Math.sin(r), y: Math.cos(r) };    // «верх» колонки
    const c = { x: top.x - half * u.x, y: top.y - half * u.y }; // центр передней грани
    const toW = (d, v) => ({ x: c.x - d * a.x + v * u.x, y: c.y - d * a.y + v * u.y });
    const poly = [
      ...m.profile.map(([d, v]) => toW(d, v)),
      ...m.profile.slice().reverse().map(([d, v]) => toW(d, -v)),
    ];
    const bottom = toW(0, -half);
    boxes.push({ i, phi, a, u, c, top, bottom, poly });
    top = bottom; // передний шарнир: низ этой колонки = верх следующей
  }
  const r0 = rad(h.tilt);
  const fa = { x: Math.cos(r0), y: -Math.sin(r0) }, fu = { x: Math.sin(r0), y: Math.cos(r0) };
  const F = boxes[0].top, f = m.frame;
  const frame = [
    F,
    { x: F.x - f.len * fa.x, y: F.y - f.len * fa.y },
    { x: F.x - f.len * fa.x + f.thick * fu.x, y: F.y - f.len * fa.y + f.thick * fu.y },
    { x: F.x + f.thick * fu.x, y: F.y + f.thick * fu.y },
  ];
  const all = boxes.flatMap(b => b.poly).concat(frame);
  const ys = all.map(p => p.y), xs = all.map(p => p.x);
  return {
    boxes, frame,
    topY: Math.max(...ys), bottomY: Math.min(...boxes.flatMap(b => b.poly).map(p => p.y)),
    minX: Math.min(...xs), maxX: Math.max(...xs),
  };
}

// Точка плоскости подвеса → координаты зала
function toWorld(h, p) {
  const a = rad(h.az);
  return { X: h.x + p.x * Math.cos(a), Y: h.y + p.x * Math.sin(a), Z: p.y };
}

// ---------- разрез по оси подвеса ----------
// Вертикальная плоскость через точку подвеса по его горизонтальному направлению.
// segs — куски зон публики, которые попали в разрез: s — расстояние от подвеса по оси, z — высота ушей.
function sectionOf(st, h) {

// Точки публики вдоль разреза (на уровне ушей)

function coverage(h, arr, samples) {
  if (!samples.length) return null;
  const half = MODELS[h.model].vDisp / 2;
  const marked = samples.map(p => ({
    ...p,
    who: arr.boxes.filter(b => Math.abs(deg(Math.atan2(b.c.y - p.z, p.s - b.c.x)) - b.phi) <= half + 1e-9).map(b => b.i),

<script>
// ---------- физика ----------

// делим на куски по 5°, каждый кусок — прямая синфазная полоса со своей направленностью sin(x)/x.
// Сабвуфер: точечный источник в центре фронта, почти круговой (спереди на 4 дБ громче, чем сзади),
// со своей задержкой и полярностью; развёрнутые назад корпуса — как в кардиоидной пачке.
// Давление от всех источников складывается с учётом фазы (разности хода и задержек), поэтому сами собой
// появляются сложение колонок, дальнобойность, интерференция сабов, кардиоид.
// Учитываем: затухание 1/r, поглощение в воздухе (20 °C, 50 %), рабочую полосу колонки (спад 24 дБ/окт за
// её краями), паспортную диаграмму по горизонтали (на низах шире). Не учитываем: отражения, фазу фильтров

function hangSources(h, arr, hang = 0) {

      const back = R ? R * (1 - Math.cos(rad(dTilt))) : 0; // края дуги чуть позади середины
      const W = toWorld(h, { x: b.c.x + v * b.u.x - back * b.a.x, y: b.c.y + v * b.u.y - back * b.a.y });
      const phi = rad(b.phi + dTilt);

// Корпуса пачки сабвуферов. Лёжа — друг на друге, стоя на боку — рядом поперёк оси.

function subBoxes(sb) {

  const out = [];
  for (let i = 0; i < sb.n; i++) {
    const rev = i >= sb.n - sb.rev;
    const lat = sb.orient === 'v' ? (i - (sb.n - 1) / 2) * m.H : 0;
    const Z = sb.orient === 'v' ? sb.z + m.W / 2 : sb.z + (i + 0.5) * m.H;
    const f = rev ? -m.D : 0; // у развёрнутого корпуса фронт — сзади пачки
    out.push({ i, rev, lat, X: sb.x + f * ca - lat * sa, Y: sb.y + f * sa + lat * ca, Z });

}
function subSources(sb, idx = 0) {
  const m = SUBS[sb.model];

  const g = 10 ** ((sb.gain || 0) / 20) * calGain(m);

    X: b.X, Y: b.Y, Z: b.Z, ca: b.rev ? -ca : ca, sa: b.rev ? -sa : sa, cp: 1, sp: 0, ell: 0,

// Калибровка: розовый шум в рабочей полосе колонки даёт на оси на 1 м её паспортный максимум.
// Тогда уровень на карте — оценка в дБ SPL при максимальной мощности, а не «относительно самого громкого места».
const calCache = new Map();
function calGain(m) {

// Направленность по горизонтали: −6 дБ на краю паспортного раскрытия, своё для левой и правой стороны
function hGain(beta, pat) {

const BAND_CHOICES = [40, 50, 63, 80, 100, 125, 250, 500, 1000, 2000, 4000, 8000];
const bandSpec = choice => choice === 'pink' ? BROAD_SPEC : [{ fc: +choice, steps: +choice <= 100 ? THIRD_STEPS : OCT_STEPS }];

const AIR_TABLE = [[31.5, 0.02], [63, 0.1], [125, 0.4], [250, 1.0], [500, 1.9], [1000, 3.7], [2000, 9.7], [4000, 32.8], [8000, 117]];

  for (let i = 1; i < AIR_TABLE.length; i++) {
    const [f1, a1] = AIR_TABLE[i];
    if (f <= f1) {

const hWiden = f => f <= 63 ? 0.05 : f <= 125 ? 0.15 : f <= 250 ? 0.35 : f <= 500 ? 0.7 : 1;

// С учётом фазы складываются: колонки внутри подвеса; все сабвуферы между собой (общий моно-сигнал);
// подвесы между собой — только если mono = true. Остальные группы — по энергии.
function levelAt(points, sources, spec = BROAD_SPEC, mono = false) {

function levelStats(Ls) {

  const mean = Ls.reduce((a, b) => a + b, 0) / Ls.length;
  const rms = Math.sqrt(Ls.reduce((a, b) => a + (b - mean) ** 2, 0) / Ls.length);
  return { max, min, mean, rms, spread: max - min };

// Сетка точек по всем зонам публики для карты уровня на виде сверху.
// У каждой зоны своя прямоугольная сетка nx × ny — карта рисуется картинкой с плавными переходами.
function zoneGrid(st, maxPts = 4000) {
  const area = st.zones.reduce((a, z) => a + Math.max(0, z.x2 - z.x1) * Math.max(0, z.y2 - z.y1), 0);
  if (!area) return { cell: 1, points: [], zones: [] };
  const cell = Math.max(0.2, Math.sqrt(area / maxPts));
  const points = [], zones = [];
  st.zones.forEach((zn, zi) => {
    const nx = Math.max(2, Math.round((zn.x2 - zn.x1) / cell)), ny = Math.max(2, Math.round((zn.y2 - zn.y1) / cell));
    const dx = (zn.x2 - zn.x1) / nx, dy = (zn.y2 - zn.y1) / ny;
    zones.push({ zi, nx, ny, start: points.length, x1: zn.x1, x2: zn.x2, y1: zn.y1, y2: zn.y2 });
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const X = zn.x1 + (i + 0.5) * dx, Y = zn.y1 + (j + 0.5) * dy;
      points.push({ zi, X, Y, Z: zoneZ(zn, X), dx, dy });
    }
  });
  return { cell, points, zones };
}

// ---------- автоподбор углов ----------
// Цель: ровный уровень по публике в разрезе подвеса без дыр в покрытии. Верхняя колонка смотрит на дальний
// ряд (допуск — до 1,5 м выше ушей), углы к низу массива не уменьшаются и растут без резких скачков.
// Старт — J-форма по геометрии, дальше перебор допустимых углов по одному стыку и перенос угла
// между соседними стыками, пока есть улучшение.
const AUTO_SPEC = [250, 1000, 4000].map(fc => ({ fc, steps: [0.85, 1, 1.15] }));

  if (over < -0.5) J += 2 * (-0.5 - over);

}
function autoSplay(st, h0, autoTilt) {

  for (let k = 1; k < n; k++) {
    const want = phiTop + (phiBot - phiTop) * (k / (n - 1)) ** 2;
    h.angles[k] = snap(Math.max(0, want - cur), m.splays);
    cur += h.angles[k];
  }
  const score = () => autoScore(h, sec, samples);
  let best = score();
  const tryValue = (get, set, values) => {
    const start = get();
    let bestV = start, improved = false;
    for (const v of values) {
      if (v === start) continue;
      set(v);
      const sc = score();
      if (sc < best - 1e-9) { best = sc; bestV = v; improved = true; }
    }
    set(bestV);
    return improved;
  };
  const maxSplay = m.splays[m.splays.length - 1];
  const tryShift = i => {
    let improved = false;
    const steps = [m.splays[1], -m.splays[1], 2 * m.splays[1], -2 * m.splays[1]];
    for (const d of steps) {
      const a = h.angles[i] + d, c = h.angles[i + 1] - d;
      if (a < 0 || c < 0 || a > maxSplay || c > maxSplay || !m.splays.includes(a) || !m.splays.includes(c)) continue;
      const oa = h.angles[i], oc = h.angles[i + 1];
      h.angles[i] = a; h.angles[i + 1] = c;
      const sc = score();
      if (sc < best - 1e-9) { best = sc; improved = true; } else { h.angles[i] = oa; h.angles[i + 1] = oc; }
    }
    return improved;
  };
  for (let pass = 0; pass < 20; pass++) {
    let improved = false;
    if (tiltFree) {
      const t0 = h.tilt;
      const opts = [-2, -1, -0.5, 0.5, 1, 2].map(d => Math.round((t0 + d) * 2) / 2).filter(v => v >= -20 && v <= 20);
      improved = tryValue(() => h.tilt, v => { h.tilt = v; }, opts) || improved;
    } else {
      improved = tryValue(() => h.angles[0], v => { h.angles[0] = v; }, m.frameSplays) || improved;
    }
    for (let i = 1; i < n; i++)
      improved = tryValue(() => h.angles[i], v => { h.angles[i] = v; }, m.splays) || improved;
    for (let i = 1; i < n - 1; i++) improved = tryShift(i) || improved;
    if (!improved) break;
  }
  return h;
}
</script>
<script>
// ---------- форматирование ----------
const fmt = (v, d = 1) => Number(v).toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtDeg = v => (Number.isInteger(v) ? String(v) : fmt(v, 1)) + '°';
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const pts = (list, X, Y) => list.map(p => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
const boxColor = (i, n) => `color-mix(in oklch, var(--ray-b) ${n > 1 ? Math.round(i / (n - 1) * 100) : 0}%, var(--ray-a))`;

// Цвета карты уровня, шаг 3 дБ (0 дБ — самое громкое место публики)
const MAP_STOPS = [[0, [253, 231, 37]], [-3, [122, 209, 81]], [-6, [34, 168, 132]], [-9, [42, 120, 142]], [-12, [65, 68, 135]], [-15, [68, 1, 84]]];
function mapRGB(d) {
  if (d >= 0) return MAP_STOPS[0][1];
  for (let i = 1; i < MAP_STOPS.length; i++) {
    const [d1, c1] = MAP_STOPS[i];
    if (d >= d1) {
      const [d0, c0] = MAP_STOPS[i - 1], t = (d0 - d) / (d0 - d1);
      return c0.map((v, k) => Math.round(v + (c1[k] - v) * t));
    }
  }
  return MAP_STOPS[MAP_STOPS.length - 1][1];
}
const mapColor = d => `rgb(${mapRGB(d)})`;
// Карта одной зоны — картинка nx × ny пикселей; при растяжении браузер плавно смешивает соседние клетки
function zoneImage(gz, L, ref) {
  const c = document.createElement('canvas');
  c.width = gz.nx; c.height = gz.ny;
  const ctx = c.getContext('2d'), img = ctx.createImageData(gz.nx, gz.ny);
  for (let j = 0; j < gz.ny; j++) for (let i = 0; i < gz.nx; i++) {
    const [r, g, b] = mapRGB(L[gz.start + j * gz.nx + i] - ref);
    const o = ((gz.ny - 1 - j) * gz.nx + i) * 4;   // в картинке Y идёт сверху вниз
    img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL();
}
function mapLegend(top) {
  return MAP_STOPS.map(([d], k) => `<span><i style="background:${mapColor(d)}"></i>${k === 0 ? '≥ ' : ''}${Math.round(top + d)}</span>`).join('');
}

// Сетка с подписями в метрах
function gridLines(out, X, Y, xr, yr, H, pad, W, s) {
  const minor = s >= 9 ? 1 : 2, major = 5;
  for (let x = Math.ceil(xr[0] / minor) * minor; x <= xr[1]; x += minor)
    out.push(`<line x1="${X(x)}" y1="${Y(yr[1])}" x2="${X(x)}" y2="${Y(yr[0])}" class="g${x % major === 0 ? ' gm' : ''}"/>`);
  for (let y = Math.ceil(yr[0] / minor) * minor; y <= yr[1]; y += minor)
    out.push(`<line x1="${X(xr[0])}" y1="${Y(y)}" x2="${X(xr[1])}" y2="${Y(y)}" class="g${y % major === 0 ? ' gm' : ''}"/>`);
  for (let x = Math.ceil(xr[0] / major) * major; x <= xr[1]; x += major)
    if (X(x) < W - pad.r - 16) out.push(`<text x="${X(x)}" y="${H - 8}" class="ax" text-anchor="middle">${x}</text>`);
  for (let y = Math.ceil(yr[0] / major) * major; y <= yr[1]; y += major)
    out.push(`<text x="${pad.l - 6}" y="${Y(y) + 4}" class="ax" text-anchor="end">${y}</text>`);
  out.push(`<text x="${W - pad.r}" y="${H - 8}" class="ax" text-anchor="end">м</text>`);
}

// ---------- вид сверху ----------
let topMap = null; // текущий масштаб вида сверху — нужен, чтобы двигать подвесы мышью
function topSVG(st, V, W) {
  const { L, W: RW } = st.room;
  const xMin = Math.min(-1.5, ...V.hangs.map(d => d.h.x - 1.5)), xMax = L + 0.6;
  const yMax = RW / 2 + 0.6, yMin = -RW / 2 - 0.6;
  const pad = { l: 34, r: 12, t: 12, b: 28 };
  const s = Math.min((W - pad.l - pad.r) / (xMax - xMin), 560 / (yMax - yMin));
  const w = Math.round(pad.l + pad.r + (xMax - xMin) * s), H = Math.round(pad.t + pad.b + (yMax - yMin) * s);
  const X = x => pad.l + (x - xMin) * s, Y = y => pad.t + (yMax - y) * s;
  topMap = { xMin, yMax, s, pad };
  const out = [];
  gridLines(out, X, Y, [xMin, xMax], [yMin, yMax], H, pad, w, s);
  // карта уровня
  if (V.map && V.map.L && V.map.zones) V.map.zones.forEach(gz => {
    out.push(`<image href="${zoneImage(gz, V.map.L, V.ref)}" x="${X(gz.x1).toFixed(1)}" y="${Y(gz.y2).toFixed(1)}" width="${((gz.x2 - gz.x1) * s).toFixed(1)}" height="${((gz.y2 - gz.y1) * s).toFixed(1)}" preserveAspectRatio="none"/>`);
  });
  out.push(`<rect x="${X(0)}" y="${Y(RW / 2)}" width="${L * s}" height="${RW * s}" class="room"/>`);
  out.push(`<text x="${X(0) - 6}" y="${Y(0)}" class="lbl" text-anchor="middle" transform="rotate(-90 ${X(0) - 6} ${Y(0)})">сцена</text>`);
  // зоны
  st.zones.forEach(z => {
    out.push(`<rect x="${X(z.x1)}" y="${Y(z.y2)}" width="${(z.x2 - z.x1) * s}" height="${(z.y2 - z.y1) * s}" class="zone${V.map && V.map.L ? ' mapped' : ''}"/>`);
    out.push(`<text x="${X(z.x1) + 5}" y="${Y(z.y2) + 14}" class="zlbl">${esc(z.name)}</text>`);
  });
  // разрез выбранного подвеса
  const sd = V.hangs[V.selIdx];
  if (sd) {
    const e = secWorld(sd.sec, sd.sec.sMax, 0);
    out.push(`<line x1="${X(sd.h.x)}" y1="${Y(sd.h.y)}" x2="${X(e.X)}" y2="${Y(e.Y)}" class="cut"/>`);
  }
  // пачки сабов: контур сверху, стрелка — куда смотрят, у развёрнутых назад — стрелка назад
  (V.subs || []).forEach(d => {
    const sb = d.s, m = SUBS[sb.model], a = rad(sb.az), ca = Math.cos(a), sa = Math.sin(a);
    const P = (f, l) => ({ x: sb.x + f * ca - l * sa, y: sb.y + f * sa + l * ca });
    const half = (sb.orient === 'v' ? sb.n * m.H : m.W) / 2;
    const body = [P(0, half), P(0, -half), P(-m.D, -half), P(-m.D, half)];
    const tip = P(0.9, 0), w1 = P(0.65, 0.15), w2 = P(0.65, -0.15);
    const back = sb.rev ? `<line x1="${X(P(-m.D, 0).x)}" y1="${Y(P(-m.D, 0).y)}" x2="${X(P(-m.D - 0.6, 0).x)}" y2="${Y(P(-m.D - 0.6, 0).y)}" class="dir"/>` : '';
    const lab = P(-m.D / 2, half + 0.5);
    out.push(`<g class="subg${d.idx === V.subSel ? ' sel' : ''}" data-sub="${d.idx}">
      <line x1="${X(sb.x)}" y1="${Y(sb.y)}" x2="${X(tip.x)}" y2="${Y(tip.y)}" class="dir"/>
      <polygon points="${pts([tip, w1, w2], X, Y)}" class="dir-head"/>
      ${back}
      <polygon points="${pts(body, X, Y)}" class="foot"/>
      <circle cx="${X(P(-m.D / 2, 0).x)}" cy="${Y(P(-m.D / 2, 0).y)}" r="14" class="grab"/>
      <text x="${X(lab.x)}" y="${Y(lab.y) + 4}" class="hlbl" text-anchor="middle">${esc(sb.name)} ×${sb.n}</text>
    </g>`);
  });
  // подвесы: контур колонки сверху и стрелка направления
  V.hangs.forEach((d, i) => {
    const h = d.h, m = MODELS[h.model], a = rad(h.az), ca = Math.cos(a), sa = Math.sin(a);
    const depth = m.profile[m.profile.length - 1][0], hw = m.width / 2;
    const P = (f, l) => ({ x: h.x + f * ca - l * sa, y: h.y + f * sa + l * ca });
    const body = [P(0, hw), P(0, -hw), P(-depth, -hw), P(-depth, hw)];
    const tip = P(1.6, 0), w1 = P(1.25, 0.18), w2 = P(1.25, -0.18);
    const lab = P(-depth - 0.6, 0);
    out.push(`<g class="hang${i === V.selIdx ? ' sel' : ''}" data-hang="${i}">
      <line x1="${X(h.x)}" y1="${Y(h.y)}" x2="${X(tip.x)}" y2="${Y(tip.y)}" class="dir"/>
      <polygon points="${pts([tip, w1, w2], X, Y)}" class="dir-head"/>
      <polygon points="${pts(body, X, Y)}" class="foot"/>
      <circle cx="${X(h.x)}" cy="${Y(h.y)}" r="14" class="grab"/>
      <text x="${X(lab.x)}" y="${Y(lab.y) + 4}" class="hlbl" text-anchor="middle">${esc(h.name)}</text>
    </g>`);
  });
  return `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" style="max-width:${w}px" id="topSvg" role="img" aria-label="Вид сверху: зал, зоны публики и подвесы">${out.join('')}</svg>`;
}

// ---------- разрез по оси выбранного подвеса ----------
const X_PAD = { l: 36, r: 14 };
const sRange = V => ({ xMin: Math.min(-1.2, V.arr.minX - 0.4), xMax: V.sec.sMax + 0.4 });

function sectionSVG(st, V, W) {
  const { h, arr, sec } = V;
  const pad = { ...X_PAD, t: 14, b: 36 };
  const { xMin, xMax } = sRange(V);
  const yMin = -0.3, yMax = Math.max(sec.H, arr.topY + 0.5) + 0.3;
  const s = (W - pad.l - pad.r) / (xMax - xMin);
  const H = Math.round(pad.t + pad.b + (yMax - yMin) * s);
  const X = x => pad.l + (x - xMin) * s, Y = y => pad.t + (yMax - y) * s;
  const out = [];
  gridLines(out, X, Y, [xMin, xMax], [0, yMax], H, pad, W, s);
  out.push(`<polyline points="${X(xMin)},${Y(0)} ${X(sec.sMax)},${Y(0)} ${X(sec.sMax)},${Y(sec.H)} ${X(xMin)},${Y(sec.H)}" class="room"/>`);
  // зоны публики в разрезе
  sec.segs.forEach(g => {
    const a = { x: g.sa, y: g.za }, b = { x: g.sb, y: g.zb };
    out.push(`<polygon points="${pts([a, b, { x: g.sb, y: Math.max(0, g.zb - 0.6) }, { x: g.sa, y: Math.max(0, g.za - 0.6) }], X, Y)}" class="aud-fill"/>`);
    out.push(`<line x1="${X(a.x)}" y1="${Y(a.y)}" x2="${X(b.x)}" y2="${Y(b.y)}" class="aud"/>`);
    out.push(`<text x="${X((g.sa + g.sb) / 2)}" y="${Y((g.za + g.zb) / 2) - 8}" class="lbl" text-anchor="middle">${esc(g.name)}</text>`);
  });
  // конусы покрытия и лучи
  const m = MODELS[h.model], surf = surfaces(sec), n = arr.boxes.length;
  if (st.view.cones) arr.boxes.forEach(b => {
    const edge = [];
    for (let k = 0; k <= 16; k++) {
      const hit = cast(b.c, b.phi - m.vDisp / 2 + m.vDisp * k / 16, surf);
      if (hit) edge.push(hit);
    }
    out.push(`<polygon points="${pts([b.c, ...edge], X, Y)}" class="cone" style="fill:${boxColor(b.i, n)}" data-i="${b.i}"/>`);
  });
  arr.boxes.forEach(b => {
    if (!b.hit) return;
    const col = boxColor(b.i, n);
    out.push(`<line x1="${X(b.c.x)}" y1="${Y(b.c.y)}" x2="${X(b.hit.x)}" y2="${Y(b.hit.y)}" class="ray" style="stroke:${col}" data-i="${b.i}"/>`);
    out.push(`<circle cx="${X(b.hit.x)}" cy="${Y(b.hit.y)}" r="3.5" class="hit" style="fill:${col}" data-i="${b.i}"/>`);
  });
  // полоса покрытия под полом
  if (V.cov) {
    const ss = V.cov.samples;
    ss.forEach((p, k) => {
      const next = ss[k + 1], prev = ss[k - 1];
      const half = Math.min(0.3, ((next ? next.s - p.s : 0) + (prev ? p.s - prev.s : 0)) / 2 || 0.05);
      const cls = p.who.length === 0 ? 'cov0' : p.who.length === 1 ? 'cov1' : 'cov2';
      out.push(`<rect x="${X(p.s - half / 2).toFixed(1)}" y="${Y(0) + 5}" width="${Math.max(1, half * s + 0.6).toFixed(1)}" height="7" class="${cls}"/>`);
    });
  }
  out.push(`<polygon points="${pts(arr.frame, X, Y)}" class="frame"/>`);
  arr.boxes.forEach(b => out.push(`<polygon points="${pts(b.poly, X, Y)}" class="box" data-i="${b.i}"/>`));
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Разрез по оси подвеса">${out.join('')}</svg>`;
}

// ---------- уровень вдоль разреза ----------
function levelSVG(st, V, W) {
  const lv = V.secL;
  if (!lv || !lv.length) return '<p class="note">В разрез этого подвеса не попала ни одна зона публики.</p>';
  const pad = { ...X_PAD, t: 12, b: 26 };
  const { xMin, xMax } = sRange(V);
  const s = (W - pad.l - pad.r) / (xMax - xMin);
  const X = x => pad.l + (x - xMin) * s;
  // ось в дБ SPL: от верха шкалы карты (или выше, если график выше) вниз минимум на 18 дБ
  const rel = lv.map(p => p.L);
  const lo = Math.min(...rel), hi = Math.max(...rel);
  const top = Math.max(V.ref, Math.ceil(hi / 3) * 3) + 1, bottom = Math.min(V.ref - 18, Math.floor((lo - 1) / 3) * 3);
  const H = 160, Y = d => pad.t + (top - d) / (top - bottom) * (H - pad.t - pad.b);
  const out = [];
  for (let d = Math.floor((top - 1) / 3) * 3; d >= bottom; d -= 3) {
    out.push(`<line x1="${X(xMin)}" y1="${Y(d)}" x2="${X(xMax)}" y2="${Y(d)}" class="g${d === V.ref ? ' gm' : ''}"/>`);
    out.push(`<text x="${pad.l - 6}" y="${Y(d) + 4}" class="ax" text-anchor="end">${d}</text>`);
  }
  for (let x = Math.ceil(xMin / 5) * 5; x <= xMax; x += 5)
    out.push(`<text x="${X(x)}" y="${H - 6}" class="ax" text-anchor="middle">${x}</text>`);
  out.push(`<text x="${W - pad.r}" y="${H - 6}" class="ax" text-anchor="end">м</text>`);
  out.push(`<text x="${pad.l + 4}" y="${pad.t + 10}" class="ax">дБ</text>`);
  // у каждой зоны своя линия (балкон может нависать над партером), разрывы — где зона прерывается
  const runs = [];
  [...new Set(lv.map(p => p.zi))].forEach(zi => {
    let prev = null;
    lv.forEach((p, k) => {
      if (p.zi !== zi) return;
      if (!prev || p.s - prev.s > 1) runs.push([]);
      runs[runs.length - 1].push({ x: X(p.s), y: Y(rel[k]) });
      prev = p;
    });
  });
  runs.forEach(r => {
    const line = r.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    out.push(`<polygon points="${r[0].x.toFixed(1)},${Y(bottom)} ${line} ${r[r.length - 1].x.toFixed(1)},${Y(bottom)}" class="lvl-fill"/>`);
    out.push(`<polyline points="${line}" class="lvl"/>`);
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Примерный уровень звука вдоль разреза">${out.join('')}</svg>`;
}

// ---------- массив крупно ----------
function arraySVG(V, W) {
  const { h, arr } = V, n = arr.boxes.length;
  const stub = 0.55;
  const xs = [arr.minX - 0.42, arr.maxX + stub + 0.1];
  const ys = [arr.bottomY - 0.22, arr.topY + 0.2];
  const pad = { l: 8, r: 8, t: 8, b: 8 };
  const sx = (W - pad.l - pad.r) / (xs[1] - xs[0]);
  const s = Math.min(sx, 440 / (ys[1] - ys[0]));
  const w = Math.round((xs[1] - xs[0]) * s + pad.l + pad.r), H = Math.round((ys[1] - ys[0]) * s + pad.t + pad.b);
  const X = x => pad.l + (x - xs[0]) * s, Y = y => pad.t + (ys[1] - y) * s;
  const out = [];
  out.push(`<polygon points="${pts(arr.frame, X, Y)}" class="frame"/>`);
  arr.boxes.forEach(b => {
    const col = boxColor(b.i, n);
    const tip = { x: b.c.x + stub * b.a.x, y: b.c.y + stub * b.a.y };
    out.push(`<line x1="${X(b.c.x)}" y1="${Y(b.c.y)}" x2="${X(tip.x)}" y2="${Y(tip.y)}" class="ray" style="stroke:${col}" data-i="${b.i}"/>`);
    out.push(`<polygon points="${pts(b.poly, X, Y)}" class="box" data-i="${b.i}"/>`);
    out.push(`<rect x="${X(b.c.x) - 3}" y="${Y(b.c.y) - 3}" width="6" height="6" style="fill:${col}" data-i="${b.i}"/>`);
    const mid = { x: b.c.x - 0.2 * b.a.x, y: b.c.y - 0.2 * b.a.y };
    out.push(`<text x="${X(mid.x)}" y="${Y(mid.y) + 4}" class="num" text-anchor="middle">${b.i + 1}</text>`);
    const back = { x: b.top.x - 0.40 * b.a.x - 0.02, y: b.top.y - 0.40 * b.a.y };
    out.push(`<text x="${X(back.x)}" y="${Y(back.y) + 4}" class="ang" text-anchor="end">${fmtDeg(h.angles[b.i])}</text>`);
  });
  const topB = arr.boxes[0], lowB = arr.boxes[n - 1];
  out.push(`<text x="${X(topB.top.x) + 6}" y="${Y(topB.top.y) - 2}" class="lbl">верх ${fmt(h.z, 2)} м</text>`);
  out.push(`<text x="${X(lowB.bottom.x) + 6}" y="${Y(lowB.bottom.y) + 14}" class="lbl">низ ${fmt(lowB.bottom.y, 2)} м</text>`);
  return `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" style="max-width:${w}px" role="img" aria-label="Массив крупно: углы между колонками">${out.join('')}</svg>`;
}
</script>
<script>
// ---------- состояние ----------
const STORE_KEY = 'razves.v3';
let uidSeq = 1;
const newId = p => p + Date.now().toString(36) + (uidSeq++);

const EXAMPLE = () => ({
  room: { L: 32, W: 20, H: 12 },
  hangs: [
    { id: 'hL', name: 'Левый', model: 'cad208', n: 8, x: 1.5, y: 6, z: 7, az: 0, tilt: 3, angles: [6, 1.5, 1.5, 3, 3, 4.5, 6, 6], pattern: '100', mirrorOf: null },
    { id: 'hR', name: 'Правый', mirrorOf: 'hL' },
  ],
  zones: [{ id: 'z1', name: 'Партер', x1: 5, x2: 30, y1: -9, y2: 9, z: 1.7, rise: 0 }],
  subs: [
    { id: 'sL', name: 'Сабы Л', model: 'cad115', n: 2, orient: 'h', rev: 0, x: 1.5, y: 4, z: 0, az: 0, delay: 0, pol: 1, gain: 0, mirrorOf: null },
    { id: 'sR', name: 'Сабы П', mirrorOf: 'sL' },
  ],
  sel: 0,
  subSel: 0,
  view: { cones: true, band: 'pink', mono: false, scaleTop: null },

function describeHit(b, sec) {

  if (hit.kind === 'aud') return { text: `${hit.name}, ${fmt(hit.x)} м`, cls: 'ok' };
  if (!sec.segs.length) return { text: { floor: 'пол', wall: 'стена', ceil: 'потолок' }[hit.kind], cls: 'warn' };
  const t = Math.tan(rad(b.phi));
  // ближняя зона: где ось пересекает уровень её ушей (продлённый к сцене)
  const near = sec.segs.reduce((a, g) => g.sa < a.sa ? g : a);
  const slope = (near.zb - near.za) / Math.max(1e-6, near.sb - near.sa);
  const sCross = (b.c.y + b.c.x * t - near.za + slope * near.sa) / (t + slope);
  if (t + slope > 1e-9 && sCross > b.c.x && sCross < near.sa) return { text: `до ближнего ряда, ${fmt(sCross)} м`, cls: 'warn' };
  if (hit.kind === 'floor') return { text: `пол вне зон, ${fmt(hit.x)} м`, cls: 'warn' };

  's.n': [1, 12], 's.rev': [0, 11], 's.x': [-30, 300], 's.y': [-100, 100], 's.z': [0, 60], 's.az': [-180, 180], 's.delay': [0, 300], 's.gain': [-40, 12],
  x1: [-30, 300], x2: [-30, 300], y1: [-100, 100], y2: [-100, 100], z: [0, 60], rise: [-30, 60],
};
// Возвращает true, если изменилась структура пульта (нужно перерисовать)
function setPath(path, raw) {
  const [head, ...rest] = path.split('.');
  const parse = () => { const v = parseFloat(String(raw).replace(',', '.')); return Number.isFinite(v) ? v : null; };
  if (head === 'autoTilt') { state.autoTilt = !!raw; return false; }
  if (head === 'view') {
    if (rest[0] === 'band') { state.view.band = String(raw); state.view.scaleTop = null; return false; }
    state.view[rest[0]] = !!raw;
    return false;
  }
  if (head === 'room') { const v = parse(); if (v == null) return false; state.room[rest[0]] = clamp(v, ...LIMITS[path]); return false; }
  if (head === 'zones') {
    const z = state.zones[+rest[0]], f = rest[1];
    if (f === 'name') { z.name = String(raw); return false; }
    const v = parse(); if (v == null) return false;
    z[f] = clamp(v, ...LIMITS[f]);
    return false;
  }
  if (head === 's') {
    const sb = state.subs[state.subSel], f = rest[0];
    if (!sb) return false;
    if (f === 'name') { sb.name = String(raw); return false; }
    if (sb.mirrorOf) return false;
    if (f === 'model') { sb.model = raw; fitSub(sb); return false; }
    if (f === 'orient') { sb.orient = raw; return false; }
    if (f === 'pol') { sb.pol = +raw < 0 ? -1 : 1; return false; }
    const v = parse(); if (v == null) return false;
    sb[f] = clamp(v, ...LIMITS[path]);
    fitSub(sb);
    return f === 'n';
  }
  if (head === 'h') {
    const hg = state.hangs[state.sel], f = rest[0];
    if (f === 'name') { hg.name = String(raw); return false; }
    if (hg.mirrorOf) return false;
    if (f === 'model') { hg.model = raw; hg.pattern = MODELS[raw].hDefault; fitHang(hg); return true; }
    if (f === 'pattern') { hg.pattern = raw; return false; }
    const v = parse(); if (v == null) return false;
    hg[f] = clamp(v, ...LIMITS[path]);
    if (f === 'n') hg.n = clamp(Math.round(hg.n), 1, MODELS[hg.model].maxBoxes);
    fitHang(hg);
    return false;
  }
  return false;
}
document.addEventListener('input', e => {
  const el = e.target.closest('#controls [data-path]');
  if (!el) return;
  const rebuild = setPath(el.dataset.path, el.type === 'checkbox' ? el.checked : el.value);
  if (/^(h|s)\.name$|^zones\.\d+\.name$/.test(el.dataset.path)) refreshNames();
  if (rebuild) renderControls();
  update();
});
document.addEventListener('change', e => {

// Имена на вкладках подвесов меняются без перерисовки пульта, чтобы поле не теряло фокус
function refreshNames() {
  document.querySelectorAll('#controls .tab[data-action="selHang"]').forEach(b => { b.textContent = state.hangs[+b.dataset.idx].name; });
  document.querySelectorAll('#controls .tab[data-action="selSub"]').forEach(b => { b.textContent = state.subs[+b.dataset.idx].name; });
}

const mirroredSubName = n => n.endsWith(' Л') ? n.slice(0, -2) + ' П' : n.endsWith(' П') ? n.slice(0, -2) + ' Л' : `${n} (зеркало)`;
const mirroredName = n => ({ 'Левый': 'Правый', 'Правый': 'Левый' })[n] || `${n} (зеркало)`;
function unlinkHang(hg) {
  const r = resolveHang(hg);
  Object.assign(hg, { ...r, angles: [...r.angles], mirrorOf: null });
}
let undoState = null;
document.addEventListener('click', e => {
  const b = e.target.closest('#controls button');
  if (!b) return;
  const act = b.dataset.action;
  if (b.dataset.step) {
    const [path, d] = b.dataset.step.split(':');
    setPath(path, Math.round((getPath(path) + parseFloat(d)) * 10) / 10);
    syncInputs();
    update();
    return;
  }
  if (!act) return;
  if (act === 'selHang') { state.sel = +b.dataset.idx; hideAuto(); }
  else if (act === 'selSub') state.subSel = +b.dataset.idx;
  else if (act === 'addSub') {
    const base = state.subs.length ? resolveSub(state.subs[state.subSel]) : { model: 'cad115', n: 2, orient: 'h', rev: 0, x: 1.5, y: 0, z: 0, az: 0, delay: 0, pol: 1, gain: 0 };
    state.subs.push(fitSub({ ...base, id: newId('s'), name: `Сабы ${state.subs.length + 1}`, mirrorOf: null, y: state.subs.length ? clamp(base.y - 2, -100, 100) : 0 }));
    state.subSel = state.subs.length - 1;
  } else if (act === 'mirrorSub') {
    const sb = state.subs[state.subSel];
    state.subs.push({ id: newId('s'), name: mirroredSubName(sb.name), mirrorOf: sb.id });
    state.subSel = state.subs.length - 1;
  } else if (act === 'unlinkSub') {
    const sb = state.subs[state.subSel];
    Object.assign(sb, { ...resolveSub(sb), mirrorOf: null });
  } else if (act === 'delSub') {
    const sb = state.subs[state.subSel];
    state.subs.filter(o => o.mirrorOf === sb.id).forEach(o => Object.assign(o, { ...resolveSub(o), mirrorOf: null }));
    state.subs.splice(state.subSel, 1);
    state.subSel = clamp(state.subSel, 0, Math.max(0, state.subs.length - 1));
  }
  else if (act === 'addHang') {
    const r = resolveHang(state.hangs[state.sel]);
    state.hangs.push({ ...r, angles: [...r.angles], id: newId('h'), name: `Подвес ${state.hangs.length + 1}`, mirrorOf: null, y: clamp(r.y - 3, -100, 100) });
    state.sel = state.hangs.length - 1;
  } else if (act === 'mirror') {
    const hg = state.hangs[state.sel];
    state.hangs.push({ id: newId('h'), name: mirroredName(hg.name), mirrorOf: hg.id });
    state.sel = state.hangs.length - 1;
  } else if (act === 'unlink') unlinkHang(state.hangs[state.sel]);
  else if (act === 'delHang') {
    const hg = state.hangs[state.sel];
    state.hangs.filter(o => o.mirrorOf === hg.id).forEach(unlinkHang);
    state.hangs.splice(state.sel, 1);
    state.sel = clamp(state.sel, 0, state.hangs.length - 1);
  } else if (act === 'addZone') {
    const { L, W, H } = state.room;
    state.zones.push(b.dataset.kind === 'balcony'
      ? { id: newId('z'), name: 'Балкон', x1: Math.round(L * 0.65), x2: Math.max(1, L - 0.5), y1: -(W / 2 - 0.5), y2: W / 2 - 0.5, z: Math.min(H - 2, 6.2), rise: 2 }
      : { id: newId('z'), name: 'Партер', x1: Math.min(5, L / 4), x2: Math.max(1, L - 2), y1: -(W / 2 - 1), y2: W / 2 - 1, z: 1.7, rise: 0 });
  } else if (act === 'delZone') state.zones.splice(+b.dataset.idx, 1);
  else if (act === 'zero') {
    const src = sourceOf(state.hangs[state.sel]);
    src.angles = src.angles.map(() => 0);
  } else if (act === 'example') { state = EXAMPLE(); undoState = null; }
  else if (act === 'auto') { runAuto(); return; }
  else if (act === 'undo' && undoState) {
    const src = state.hangs.find(o => o.id === undoState.id);
    if (src) { src.tilt = undoState.tilt; src.angles = [...undoState.angles]; }
    undoState = null;
    hideAuto();
    syncInputs();
    update();
    return;
  }
  renderControls();
  update();
});
function hideAuto() { const r = document.getElementById('autoResult'); if (r) r.hidden = true; }

function runAuto() {
  const res = document.getElementById('autoResult'), note = document.getElementById('autoNote');
  const src = sourceOf(state.hangs[state.sel]);
  const before = V && V.sel.secL.length ? levelStats(V.sel.secL.map(p => p.L)).spread : null;
  const geo = { room: state.room, zones: state.zones.map(normZone) };
  const next = autoSplay(geo, src, state.autoTilt);
  if (!next) {
    note.textContent = 'В разрез этого подвеса не попала ни одна зона публики — подбирать не под что.';
    res.hidden = false;
    return;
  }
  undoState = { id: src.id, tilt: src.tilt, angles: [...src.angles] };
  src.tilt = next.tilt;
  src.angles = next.angles;
  syncInputs();
  update();
  const after = levelStats(V.sel.secL.map(p => p.L)).spread;
  note.textContent = before == null ? `Подобрано: разброс вдоль разреза ${fmt(after)} дБ.` : `Подобрано: разброс вдоль разреза ${fmt(after)} дБ, было ${fmt(before)} дБ.`;
  res.hidden = false;
}

// ---------- перетаскивание подвесов на виде сверху ----------
let drag = null;
function toRoom(e) {
  const svg = document.getElementById('topSvg');
  if (!svg || !topMap) return null;
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, k = vb.width / r.width;
  const px = (e.clientX - r.left) * k, py = (e.clientY - r.top) * k;
  return { X: topMap.xMin + (px - topMap.pad.l) / topMap.s, Y: topMap.yMax - (py - topMap.pad.t) / topMap.s };
}
function bindTopView() {
  const box = document.getElementById('topView');
  box.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-hang],[data-sub]');
    if (!g) return;
    const isSub = g.dataset.sub != null;
    const i = +(isSub ? g.dataset.sub : g.dataset.hang);
    if (isSub && i !== state.subSel) { state.subSel = i; renderControls(); update(); }
    if (!isSub && i !== state.sel) { state.sel = i; hideAuto(); renderControls(); update(); }
    const p = toRoom(e), r = isSub ? resolveSub(state.subs[i]) : resolveHang(state.hangs[i]);
    if (!p) return;
    drag = { i, isSub, dx: r.x - p.X, dy: r.y - p.Y, id: e.pointerId };
    box.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  box.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = toRoom(e);
    if (!p) return;
    const hg = drag.isSub ? state.subs[drag.i] : state.hangs[drag.i];
    const src = drag.isSub ? subSourceOf(hg) : sourceOf(hg);
    const x = clamp(Math.round((p.X + drag.dx) * 10) / 10, -30, 300), y = clamp(Math.round((p.Y + drag.dy) * 10) / 10, -100, 100);
    src.x = x;
    src.y = hg.mirrorOf ? -y : y;
    scheduleUpdate();
  });
  const end = e => { if (drag && e.pointerId === drag.id) { drag = null; syncInputs(); update(); } };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
}
let pending = false;
function scheduleUpdate() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; syncInputs(); update(); });
}

function renderChips() {
  const D = V.sel, h = D.h, m = MODELS[h.model], f = m.frame, cov = D.cov;
  const chip = (k, v, cls = '') => `<div class="chip ${cls}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const rowChip = (title, s) => s && s.who.length ? chip(title, `колонка ${s.who.map(i => i + 1).join(', ')}`, 'ok') : chip(title, 'не покрыт', 'bad');
  const weight = h.n * m.weight + f.weight;
  const out = [];
  if (V.mapStats) {
    const sp = V.mapStats.spread;
    out.push(chip('Средний по публике', `${fmt(V.avg)} дБ`));
    out.push(chip('Разброс по всем зонам', `${fmt(sp)} дБ`, sp <= 6 ? 'ok' : sp <= 10 ? 'warn' : 'bad'));
  }
  if (cov) {
    const pct = Math.round(cov.share * 100);
    out.push(chip(`Покрытие · ${esc(h.name)}`, `${pct} %`, pct === 100 ? 'ok' : pct >= 90 ? 'warn' : 'bad'));
    out.push(rowChip('Ближний ряд', cov.first));
    out.push(rowChip('Дальний ряд', cov.last));
  } else {
    out.push(chip(`Покрытие · ${esc(h.name)}`, 'нет зон в разрезе', 'bad'));
  }
  out.push(chip('Низ массива', `${fmt(D.arr.bottomY, 2)} м`));
  out.push(f.maxLoad
    ? chip('Вес подвеса', `${fmt(weight, 1)} из ${f.maxLoad} кг`, weight <= f.maxLoad ? 'ok' : 'bad')
    : chip('Вес подвеса', `${fmt(weight, 1)} кг`));
  out.push(chip('Колонок', `${h.n} из ${f.maxBoxes}`, h.n <= f.maxBoxes ? 'ok' : 'bad'));
  document.getElementById('chips').innerHTML = out.join('');
}

  applyHighlight();
}
// Сначала быстрый расчёт с грубой картой, точная карта — когда ввод затих
let fullTimer = null;
function update(full = false) {
  V = derive(!full);
  renderChips();
  drawViews();
  renderTable();
  if (!full) {
    clearTimeout(fullTimer);
    fullTimer = setTimeout(() => update(true), 250);
  }
  saveState();
}

renderControls();
renderResults();
renderNotes();
update();
new ResizeObserver(() => { if (V) drawViews(); }).observe(document.getElementById('results'));
</script>
